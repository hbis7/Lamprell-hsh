function useStore(key,def){
  const[v,setV]=useState(()=>{try{const s=localStorage.getItem("lksa_"+key);return s?JSON.parse(s):def;}catch(e){return def;}});
  const set=useCallback(fn=>{setV(prev=>{const n=typeof fn==="function"?fn(prev):fn;try{localStorage.setItem("lksa_"+key,JSON.stringify(n));}catch(e){}return n;});},[key]);
  return[v,set];
}

function dlCSV(rows,filename){
  if(!rows?.length)return;
  const ks=Object.keys(rows[0]);
  const csv=[ks.join(","),...rows.map(r=>ks.map(k=>`"${(r[k]??'').toString().replace(/"/g,'""')}"`).join(","))].join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=filename+".csv";a.click();
}
function dlExcel(sheets,filename){
  try{
    const wb=XLSX.utils.book_new();
    sheets.forEach(({name,data})=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),name));
    XLSX.writeFile(wb,filename+".xlsx");
  }catch(e){alert("Excel error: "+e.message);}
}
function buildPRExport(prs,users,lang){

      Justification:p.justification||"",Notes:p.notes||"",Created:p.createdAt?.split("T")[0]||""};

function buildTaskExport(tasks,users,lang){
  return tasks.map(tk=>{

// ─── CHARTS ──────────────────────────────────────────────────────────────────
function Donut({data,size=140}){
  const total=data.reduce((s,d)=>s+d.v,0);
  if(!total)return <div style={{textAlign:"center",color:C.textLt,padding:20,fontSize:12}}>No data</div>;
  const r=52,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  let off=0;
  const slices=data.map(d=>{const pct=d.v/total;const dash=pct*circ;const s={...d,off,dash};off+=dash;return s;});
  return(
    <div>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)",display:"block",margin:"0 auto"}}>
        <circle cx={cx} cy={cy} r={r} fill="none" stroke={C.bg2} strokeWidth={16}/>
        {slices.map((s,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.c} strokeWidth={16} strokeDasharray={`${s.dash} ${circ-s.dash}`} strokeDashoffset={-s.off} strokeLinecap="butt"/>)}
        <text x={cx} y={cy-5} textAnchor="middle" fontSize="20" fontWeight="800" fill={C.navy} style={{transform:`rotate(90deg)`,transformOrigin:`${cx}px ${cy}px`}}>{total}</text>
        <text x={cx} y={cy+14} textAnchor="middle" fontSize="9" fill={C.textLt} style={{transform:`rotate(90deg)`,transformOrigin:`${cx}px ${cy}px`}}>Total</text>
      </svg>
      <div style={{display:"flex",flexWrap:"wrap",justifyContent:"center",gap:"4px 10px",marginTop:8}}>
        {data.map((d,i)=><span key={i} style={{display:"flex",alignItems:"center",gap:4,fontSize:11}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:d.c,display:"inline-block",flexShrink:0}}/>
          <span style={{color:C.textMd}}>{d.l}</span><b style={{color:C.text}}>{d.v}</b>
        </span>)}
      </div>
    </div>
  );
}

function Bars({data,h=120}){
  const mx=Math.max(...data.map(d=>d.v),1);

      {data.map((d,i)=>{
        const bh=Math.max(d.v/mx*h,d.v?3:0);

          <span style={{fontSize:9,fontWeight:700,color:C.navy,height:14,display:"flex",alignItems:"center"}}>{d.v?fmtN(d.v):""}</span>
          <div style={{width:"100%",background:C.bg2,borderRadius:"3px 3px 0 0",height:h,display:"flex",alignItems:"flex-end"}}>
            <div style={{width:"100%",height:bh,background:`linear-gradient(to top,${C.navy},${C.orange})`,borderRadius:"3px 3px 0 0",transition:"height 0.5s ease"}}/>

function Progress({value,color=C.orange,height=6,showLabel=false}){
  const pct=Math.min(100,Math.max(0,value||0));

function FileUp({attachments,setAttachments,lang}){
  const ref=useRef();
  const handle=files=>{Array.from(files).forEach(file=>{
    if(file.size>8*1024*1024){alert(file.name+" too large (max 8MB)");return;}
    const rd=new FileReader();
    rd.onload=e=>setAttachments(prev=>[...prev,{id:uid(),name:file.name,type:file.type,size:file.size,data:e.target.result,at:now()}]);
    rd.readAsDataURL(file);
  });};
  const rm=id=>setAttachments(prev=>prev.filter(a=>a.id!==id));
  const ico=t=>t?.includes("image")?"🖼️":t?.includes("pdf")?"📄":t?.includes("word")?"📝":t?.includes("excel")||t?.includes("sheet")?"📊":"📎";
  const fsz=b=>b>1048576?`${(b/1048576).toFixed(1)}MB`:`${(b/1024).toFixed(0)}KB`;
  return <div>
    <div onClick={()=>ref.current.click()} onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files);}} onDragOver={e=>e.preventDefault()}
      style={{border:"2px dashed "+C.border,borderRadius:10,padding:18,textAlign:"center",cursor:"pointer",background:C.bg,transition:"border-color 0.15s"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=C.orange} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
      <div style={{fontSize:22,marginBottom:4}}>📎</div>
      <div style={{fontSize:12,color:C.textMd}}>{tr(lang,"dropFiles")}</div>
      <div style={{fontSize:11,color:C.textLt,marginTop:2}}>PDF, Word, Excel, Images — max 8MB each</div>
      <input ref={ref} type="file" multiple style={{display:"none"}} onChange={e=>handle(e.target.files)}/>
    </div>
    {attachments?.length>0&&<div style={{marginTop:8,display:"grid",gap:5}}>
      {attachments.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 12px",background:C.bg,borderRadius:8,border:"1px solid "+C.border}}>
        <span style={{fontSize:16}}>{ico(a.type)}</span>
        <div style={{flex:1,overflow:"hidden"}}>
          <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.name}</div>
          <div style={{fontSize:10,color:C.textLt}}>{fsz(a.size)}</div>
        </div>
        <a href={a.data} download={a.name} style={{color:C.blue,fontSize:11,textDecoration:"none",padding:"2px 4px"}}>⬇</a>
        <button onClick={()=>rm(a.id)} style={{background:"none",border:"none",cursor:"pointer",color:C.red,fontSize:13,padding:"2px"}}>✕</button>
      </div>)}
    </div>}
  </div>;
}

// ─── PROCUREMENT ─────────────────────────────────────────────────────────────
function Procurement({user,procurement,setProcurement,users,lang}){
  const[tab,setTab]=useState("list");
  const[sFilter,setSF]=useState("all");
  const[dFilter,setDF]=useState("all");
  const[pFilter,setPF]=useState("all");
  const[search,setSearch]=useState("");
  const[selected,setSelected]=useState(null);
  const[showNew,setShowNew]=useState(false);
  const[showAct,setShowAct]=useState(null);
  const[showExport,setShowExport]=useState(false);

  const list=useMemo(()=>{
    let l=procurement;
    if(user.role==="employee") l=l.filter(p=>p.requestedBy===user.id);
    else if(user.role==="manager") l=l.filter(p=>p.department===user.department||p.requestedBy===user.id);
    if(sFilter!=="all") l=l.filter(p=>p.status===sFilter);
    if(dFilter!=="all") l=l.filter(p=>p.department===dFilter);
    if(pFilter!=="all") l=l.filter(p=>p.priority===pFilter);
    if(search) l=l.filter(p=>p.title?.toLowerCase().includes(search.toLowerCase())||p.number?.includes(search));
    return l.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  },[procurement,user,sFilter,dFilter,pFilter,search]);

  const canApprove=p=>{
    if(!gp(user,"procurement","approve")) return false;
    if(user.role==="admin"||user.role==="procurement_admin") return p.status!=="completed"&&p.status!=="rejected";
    if(user.role==="manager"&&p.department===user.department&&p.status==="pending") return true;
    if(user.role==="manager"&&user.department==="finance"&&p.status==="approved") return true;
    return false;
  };

  const doAction=(pr,action,note)=>{
    let ns=action==="approve"?(pr.status==="pending"?"approved":"processing"):action==="complete"?"completed":"rejected";
    setProcurement(l=>l.map(p=>p.id!==pr.id?p:{...p,status:ns,approvals:[...p.approvals,{by:user.id,role:user.position,action:action==="approve"?"approved":action==="complete"?"completed":"rejected",date:tod(),note:note||""}]}));
    setShowAct(null);
    if(selected?.id===pr.id) setSelected(prev=>({...prev,status:ns}));
  };

  const counts={all:procurement.filter(p=>user.role==="employee"?p.requestedBy===user.id:user.role==="manager"?p.department===user.department||p.requestedBy===user.id:true).length};
  Object.keys(PRS).forEach(k=>{counts[k]=(user.role==="employee"?procurement.filter(p=>p.requestedBy===user.id&&p.status===k).length:user.role==="manager"?procurement.filter(p=>(p.department===user.department||p.requestedBy===user.id)&&p.status===k).length:procurement.filter(p=>p.status===k).length);});

  if(selected) return <PRDetail pr={selected} users={users} user={user} canApprove={canApprove(selected)} onBack={()=>setSelected(null)} onAction={(a,n)=>doAction(selected,a,n)} lang={lang}/>;

  const tabs=[{id:"all",l:tr(lang,"all"),n:counts.all},{id:"pending",l:tr(lang,"pending"),n:counts.pending},{id:"approved",l:tr(lang,"approved"),n:counts.approved},{id:"processing",l:lang==="ar"?"قيد المعالجة":"Processing",n:counts.processing},{id:"completed",l:tr(lang,"completed"),n:counts.completed}];

  return(
    <div className="fade" style={{padding:24,maxWidth:1200,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:10}}>
        <div><div style={{fontSize:19,fontWeight:700}}>🛒 {tr(lang,"procurement")}</div>
          <div style={{fontSize:12,color:C.textLt,marginTop:2}}>{lang==="ar"?"إنشاء ومتابعة طلبات الشراء والتوريد مع حساب الضريبة":"Create and track purchase requests with VAT calculation"}</div></div>
        <div style={{display:"flex",gap:8}}>
          {gp(user,"procurement","export")&&<Btn ch={tr(lang,"exportExcel")} v="ghost" sz="sm" icon="📊" onClick={()=>{dlExcel([{name:"Procurement",data:buildPRExport(list,users,lang)}],"PR_Report_"+tod());}}/>}
          {gp(user,"procurement","create")&&<Btn ch={tr(lang,"newReq")} v="orange" icon="➕" onClick={()=>setShowNew(true)}/>}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:18}}>
        {["all","pending","approved","processing","completed"].map(k=>{
          const s=PRS[k];
          return <div key={k} onClick={()=>setSF(k)} style={{background:sFilter===k?C.navy:C.white,borderRadius:10,padding:"12px 14px",border:"1px solid "+(sFilter===k?C.navy:C.border),cursor:"pointer",transition:"all 0.15s",boxShadow:sFilter===k?"0 4px 14px rgba(0,45,98,0.2)":"none"}}>
            <div style={{fontSize:11,color:sFilter===k?"rgba(255,255,255,0.7)":C.textLt,marginBottom:4}}>{k==="all"?tr(lang,"all"):(lang==="ar"?s?.ar:s?.en)||k}</div>
            <div style={{fontSize:22,fontWeight:800,color:sFilter===k?C.orange:s?.color||C.text}}>{counts[k]||0}</div>
          </div>;
        })}
      </div>

      <Card ch={<div style={{padding:14,display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder={"🔍  "+tr(lang,"search")}
          style={{flex:1,minWidth:200,padding:"8px 13px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:13,outline:"none",background:C.white}}/>
        <select value={dFilter} onChange={e=>setDF(e.target.value)} style={{padding:"8px 12px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:12,background:C.white}}>
          <option value="all">{tr(lang,"filterDept")}</option>
          {DEPTS.map(d=><option key={d.id} value={d.id}>{lang==="ar"?d.ar:d.en}</option>)}
        </select>
        <select value={pFilter} onChange={e=>setPF(e.target.value)} style={{padding:"8px 12px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:12,background:C.white}}>
          <option value="all">{tr(lang,"filterPriority")}</option>
          {Object.entries(PRI).map(([k,v])=><option key={k} value={k}>{lang==="ar"?v.ar:v.en}</option>)}
        </select>
        {(search||sFilter!=="all"||dFilter!=="all"||pFilter!=="all")&&<Btn ch={tr(lang,"clearFilters")} v="ghost" sz="sm" onClick={()=>{setSearch("");setSF("all");setDF("all");setPF("all");}}/>}
      </div>} st={{marginBottom:12}}/>

      <Card ch={<div style={{overflowX:"auto"}}>
        {list.length===0?<Empty msg={tr(lang,"noData")} icon="🔍"/>:
        <table><thead><tr style={{background:C.bg}}>
          {[tr(lang,"reqNo"),tr(lang,"reqTitle"),tr(lang,"dept"),tr(lang,"reqBy"),tr(lang,"reqDate"),tr(lang,"priority"),"Subtotal","VAT 15%","Grand Total",tr(lang,"status"),lang==="ar"?"إجراء":"Action"].map(h=>
            <th key={h} style={{padding:"10px 13px",fontSize:11,fontWeight:700,color:C.textLt,textAlign:"right",borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{h}</th>)}
        </tr></thead>
        <tbody>{list.map((p,i)=>{
          const req=users.find(u=>u.id===p.requestedBy);
          return <tr key={p.id} style={{borderBottom:"1px solid "+C.border,background:i%2?"#fff":C.bg+"44",cursor:"pointer",transition:"background 0.1s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.bg} onMouseLeave={e=>e.currentTarget.style.background=i%2?"#fff":C.bg+"44"}>
            <td style={{padding:"10px 13px",fontSize:11,fontWeight:700,color:C.blue,direction:"ltr",whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{p.number}</td>
            <td style={{padding:"10px 13px",fontSize:13,maxWidth:180}} onClick={()=>setSelected(p)}><div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500}}>{p.title}</div></td>
            <td style={{padding:"10px 13px"}} onClick={()=>setSelected(p)}><Bdg label={gd(p.department,lang).name} color={gd(p.department,lang).color} bg={gd(p.department,lang).bg} sz={10}/></td>
            <td style={{padding:"10px 13px",fontSize:12,color:C.textMd,whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{req?.name||"—"}</td>
            <td style={{padding:"10px 13px",fontSize:11,color:C.textLt,whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{fmtD(p.requestDate,lang)}</td>
            <td style={{padding:"10px 13px"}} onClick={()=>setSelected(p)}><PriBadge priority={p.priority} lang={lang}/></td>
            <td style={{padding:"10px 13px",fontSize:12,direction:"ltr",textAlign:"left",whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{fmtN(p.subtotal,2)}</td>
            <td style={{padding:"10px 13px",fontSize:12,direction:"ltr",textAlign:"left",color:C.orange,fontWeight:600,whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{fmtN(p.taxAmount,2)}</td>
            <td style={{padding:"10px 13px",fontSize:13,fontWeight:700,direction:"ltr",textAlign:"left",color:C.navy,whiteSpace:"nowrap"}} onClick={()=>setSelected(p)}>{fmtN(p.grandTotal,2)} SAR</td>
            <td style={{padding:"10px 13px"}} onClick={()=>setSelected(p)}><PRBadge status={p.status} lang={lang}/></td>
            <td style={{padding:"10px 13px"}}>
              {canApprove(p)&&<div style={{display:"flex",gap:4}}>
                <Btn ch={lang==="ar"?"موافقة":"Approve"} v="green" sz="sm" onClick={e=>{e.stopPropagation();setShowAct({p,action:"approve"});}}/>
                <Btn ch={lang==="ar"?"رفض":"Reject"} v="red" sz="sm" onClick={e=>{e.stopPropagation();setShowAct({p,action:"reject"});}}/>
              </div>}
            </td>
          </tr>;
        })}</tbody></table>}
      </div>} st={{overflow:"hidden"}}/>

      {showNew&&<NewPR user={user} users={users} lang={lang} onClose={()=>setShowNew(false)} onSave={pr=>{setProcurement(l=>[pr,...l]);setShowNew(false);}}/>}
      {showAct&&<ActionModal data={showAct} lang={lang} onClose={()=>setShowAct(null)} onConfirm={(n)=>doAction(showAct.p,showAct.action,n)}/>}
    </div>
  );
}

function NewPR({user,users,lang,onClose,onSave}){
  const[title,st]=useState("");const[priority,sp]=useState("normal");const[just,sj]=useState("");const[notes,sn]=useState("");
  const[items,si]=useState([{id:"i1",name:"",descr:"",qty:1,unit:lang==="ar"?"قطعة":"pcs",unitPrice:0,total:0}]);
  const[attachments,sa]=useState([]);
  const subT=items.reduce((s,i)=>s+(i.total||0),0);
  const{tax,grand}=calcTax(subT);
  const upItem=(idx,field,val)=>si(prev=>prev.map((it,i)=>{
    if(i!==idx)return it;
    const up={...it,[field]:field==="qty"||field==="unitPrice"?parseFloat(val)||0:val};
    if(field==="qty"||field==="unitPrice") up.total=+(up.qty||0)*(up.unitPrice||0);
    return up;
  }));
  const addItem=()=>si(p=>[...p,{id:"i"+(p.length+1),name:"",descr:"",qty:1,unit:lang==="ar"?"قطعة":"pcs",unitPrice:0,total:0}]);
  const rmItem=idx=>si(p=>p.filter((_,i)=>i!==idx));
  const save=()=>{
    if(!title.trim()||items.some(it=>!it.name.trim())){alert(lang==="ar"?"يرجى ملء العنوان وجميع أسماء البنود":"Fill title and all item names");return;}

function ActionModal({data,lang,onClose,onConfirm}){

    footer={<><Btn ch={tr(lang,"cancel")} v="ghost" onClick={onClose}/><Btn ch={isReject?(lang==="ar"?"تأكيد الرفض":"Confirm Reject"):data.action==="complete"?(lang==="ar"?"تأكيد الإتمام":"Confirm Complete"):(lang==="ar"?"تأكيد الموافقة":"Confirm Approval")} v={isReject?"red":"green"} onClick={()=>{if(isReject&&!note.trim()){alert(lang==="ar"?"يرجى ذكر سبب الرفض":"Rejection reason required");return;}onConfirm(note);}}/></>}>

    <Lbl label={isReject?tr(lang,"rejectReason"):tr(lang,"approveNote")} req={isReject} ch={<Txta val={note} set={sn} rows={3} ph={isReject?(lang==="ar"?"سبب واضح للرفض…":"Clear reason for rejection…"):(lang==="ar"?"ملاحظة (اختياري)":"Note (optional)")}/>}/>

}

// ─── TASKS ───────────────────────────────────────────────────────────────────
function Tasks({user,tasks,setTasks,users,lang}){
  const[tab,setTab]=useState("mine");
  const[selected,setSel]=useState(null);
  const[showNew,setNew]=useState(false);
  const myTasks=tasks.filter(t=>t.assignedTo===user.id);
  const assignedByMe=tasks.filter(t=>t.assignedBy===user.id&&t.assignedTo!==user.id);
  const allTasks=tasks;
  const showAll=user.role==="admin"||user.role==="procurement_admin"||user.role==="manager";
  const list=(tab==="mine"?myTasks:tab==="byMe"?assignedByMe:allTasks).sort((a,b)=>{
    const o={urgent:0,high:1,normal:2,low:3};
    const od=(t)=>isOD(t.dueDate,t.status)?-1:0;
    return od(a)-od(b)||(o[a.priority]||2)-(o[b.priority]||2);
  });

  const updateTask=(id,changes)=>setTasks(l=>l.map(t=>t.id===id?{...t,...changes}:t));
  const addUpdate=(taskId,text,type="comment")=>{
    const up={id:uid(),type,by:user.id,at:now(),text};
    setTasks(l=>l.map(t=>t.id===taskId?{...t,updates:[...t.updates,up]}:t));
  };

  const canCreate=gp(user,"tasks","create")||gp(user,"tasks","assign");
  const tabs2=[{id:"mine",l:tr(lang,"myTasks"),n:myTasks.length}];
  if(showAll){tabs2.push({id:"byMe",l:tr(lang,"assignedByMe"),n:assignedByMe.length});tabs2.push({id:"all",l:tr(lang,"allTasks"),n:allTasks.length});}

  if(selected){
    const task=tasks.find(t=>t.id===selected);
    if(!task){setSel(null);return null;}
    return <TaskDetail task={task} users={users} user={user} lang={lang} onBack={()=>setSel(null)} onUpdate={(changes)=>updateTask(selected,changes)} onAddUpdate={(txt,type)=>addUpdate(selected,txt,type)}/>;
  }

  const grp={urgent:[],high:[],normal:[],low:[]};
  list.forEach(t=>grp[t.priority]?.push(t));

  return(
    <div className="fade" style={{padding:24,maxWidth:1100,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18,flexWrap:"wrap",gap:10}}>
        <div><div style={{fontSize:19,fontWeight:700}}>✅ {tr(lang,"tasks")}</div>
          <div style={{fontSize:12,color:C.textLt,marginTop:2}}>{lang==="ar"?"إنشاء ومتابعة المهام مع تتبع التقدم والإنجاز":"Create and track tasks with progress and completion tracking"}</div></div>
        {canCreate&&<Btn ch={tr(lang,"newTask")} v="orange" icon="➕" onClick={()=>setNew(true)}/>}
      </div>
      <Tabs tabs={tabs2} active={tab} onChange={setTab}/>
      <div style={{display:"grid",gap:10}}>
        {list.length===0?<Empty msg={tr(lang,"noData")} icon="✅"/>:list.map(task=>{
          const assignee=users.find(u=>u.id===task.assignedTo);
          const assigner=users.find(u=>u.id===task.assignedBy);
          const od=isOD(task.dueDate,task.status);
          const isMe=task.assignedTo===user.id;
          return(
            <Card key={task.id} onClick={()=>setSel(task.id)} ch={<div style={{padding:18}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
                    <TSBadge status={task.status} lang={lang}/>
                    <PriBadge priority={task.priority} lang={lang}/>
                    <Bdg label={gd(task.department,lang).name} color={gd(task.department,lang).color} bg={gd(task.department,lang).bg} sz={10}/>
                    {od&&<span style={{background:C.redBg,color:C.redText,fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:20}}>⚠ {tr(lang,"overdue")}</span>}
                  </div>
                  <div style={{fontSize:15,fontWeight:700,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.title}</div>
                  {task.description&&<div style={{fontSize:12,color:C.textMd,marginBottom:8,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.description}</div>}
                  <div style={{marginBottom:8}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:11,color:C.textLt}}>{tr(lang,"progress")}</span>
                      <span style={{fontSize:11,fontWeight:700,color:od?C.red:C.orange}}>{task.progress||0}%</span>
                    </div>
                    <Progress value={task.progress} color={od?C.red:C.orange}/>
                  </div>
                  <div style={{display:"flex",gap:14,fontSize:11,color:C.textLt,flexWrap:"wrap"}}>
                    <span>👤 {assignee?.name||"—"}</span>
                    {assigner&&assigner.id!==assignee?.id&&<span>{lang==="ar"?"من: ":"by: "}{assigner.name}</span>}
                    {task.dueDate&&<span>📅 {fmtD(task.dueDate,lang)}</span>}
                    <span>💬 {task.updates?.length||0}</span>
                    {task.estHours>0&&<span>⏱ {task.estHours}h est</span>}
                    {task.completedAt&&<span>✅ {fmtD(task.completedAt,lang)}</span>}
                  </div>
                </div>
                {isMe&&task.status!=="completed"&&task.status!=="cancelled"&&(
                  <div style={{display:"flex",gap:6,flexShrink:0}}>
                    {task.status==="new"&&<Btn ch={tr(lang,"startTask")} v="primary" sz="sm" onClick={e=>{e.stopPropagation();updateTask(task.id,{status:"in-progress",updates:[...task.updates,{id:uid(),type:"status",by:user.id,at:now(),text:"Task started."}]});}}/>}
                    {task.status==="in-progress"&&<Btn ch={tr(lang,"completeTask")} v="green" sz="sm" onClick={e=>{e.stopPropagation();updateTask(task.id,{status:"completed",progress:100,completedAt:now(),updates:[...task.updates,{id:uid(),type:"completed",by:user.id,at:now(),text:"Task marked complete."}]});}}/>}
                  </div>
                )}
              </div>
            </div>}/>
          );
        })}
      </div>
      {showNew&&<NewTask user={user} users={users} lang={lang} onClose={()=>setNew(false)} onSave={t=>{setTasks(l=>[t,...l]);setNew(false);}}/>}
    </div>
  );
}

function TaskDetail({task,users,user,lang,onBack,onUpdate,onAddUpdate}){

  const[prog,sp]=useState(task.progress||0);
  const assignee=users.find(u=>u.id===task.assignedTo);
  const assigner=users.find(u=>u.id===task.assignedBy);
  const isMe=task.assignedTo===user.id;
  const od=isOD(task.dueDate,task.status);
  const addC=()=>{if(!comment.trim())return;onAddUpdate(comment,"comment");sc("");};
  const updProg=()=>{onUpdate({progress:prog,updates:[...task.updates,{id:uid(),type:"progress",by:user.id,at:now(),text:`Progress updated to ${prog}%.`}]});};
  const typeIcon={created:"📝",status:"🔄",comment:"💬",progress:"📊",completed:"✅"};
  return(
    <div className="fade" style={{padding:24,maxWidth:960,margin:"0 auto"}}>
      <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:C.textMd,marginBottom:16}}>← {tr(lang,"back")}</button>

            <PriBadge priority={task.priority} lang={lang}/>
            <Bdg label={gd(task.department,lang).name} color={gd(task.department,lang).color} bg={gd(task.department,lang).bg}/>
            {od&&<span style={{background:C.redBg,color:C.redText,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>⚠ {tr(lang,"overdue")}</span>}
          </div>
          <div style={{fontSize:20,fontWeight:700,marginBottom:6}}>{task.title}</div>
          {task.description&&<div style={{fontSize:13,color:C.textMd,lineHeight:1.7}}>{task.description}</div>}
        </div>
        {isMe&&task.status!=="completed"&&task.status!=="cancelled"&&<div style={{display:"flex",gap:8}}>
          {task.status==="new"&&<Btn ch={tr(lang,"startTask")} v="primary" onClick={()=>onUpdate({status:"in-progress",updates:[...task.updates,{id:uid(),type:"status",by:user.id,at:now(),text:"Task started."}]})}/>}
          {task.status==="in-progress"&&<Btn ch={tr(lang,"completeTask")} v="green" onClick={()=>onUpdate({status:"completed",progress:100,completedAt:now(),updates:[...task.updates,{id:uid(),type:"completed",by:user.id,at:now(),text:"Task marked complete."}]})}/>}
        </div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16}}>
        <div>
          {isMe&&task.status!=="completed"&&task.status!=="cancelled"&&(

              <div style={{display:"flex",align:"center",gap:12,marginBottom:8}}>
                <input type="range" min={0} max={100} value={prog} onChange={e=>sp(+e.target.value)} style={{flex:1}}/>
                <span style={{fontWeight:700,color:C.orange,minWidth:36}}>{prog}%</span>
              </div>
              <Progress value={prog} color={C.orange}/>
              <div style={{marginTop:12}}><Btn ch={lang==="ar"?"تحديث نسبة الإنجاز":"Update Progress"} v="orange" sz="sm" onClick={updProg}/></div>
            </div>} st={{marginBottom:14}}/>
          )}
          <Card ch={<div>
            <div style={{padding:"14px 18px",borderBottom:"1px solid "+C.border,fontSize:13,fontWeight:700}}>💬 {tr(lang,"activityLog")} ({task.updates?.length||0})</div>
            <div style={{maxHeight:360,overflowY:"auto"}}>
              {task.updates?.map((u,i)=>{
                const author=users.find(x=>x.id===u.by);
                return <div key={i} style={{padding:"12px 18px",borderBottom:"1px solid "+C.border,display:"flex",gap:10}}>
                  <Avtr name={author?.name||"?"} size={30} bg={C.orangeLt} color={C.orange}/>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                      <span style={{fontSize:12,fontWeight:700}}>{author?.name||"System"}</span>
                      <span style={{fontSize:10,color:C.textLt}}>{fmtD(u.at,lang)}</span>
                    </div>
                    <div style={{fontSize:12,color:C.textMd,lineHeight:1.6}}>{typeIcon[u.type]||"•"} {u.text}</div>
                  </div>
                </div>;
              })}
            </div>
            <div style={{padding:"14px 18px",borderTop:"1px solid "+C.border}}>
              <div style={{display:"flex",gap:8}}>
                <Txta val={comment} set={sc} rows={2} ph={tr(lang,"addUpdate")+"…"}/>

function NewTask({user,users,lang,onClose,onSave}){
  const[title,st]=useState("");const[desc,sd]=useState("");
  const[dept,sde]=useState(user.department);const[assignedTo,sa]=useState("");
  const[dueDate,sdd]=useState("");const[priority,sp]=useState("normal");
  const[estH,se]=useState("");const[attachments,sat]=useState([]);
  const save=()=>{
    if(!title.trim()||!assignedTo){alert(lang==="ar"?"يرجى ملء العنوان والمسند إليه":"Fill title and assignee");return;}
    onSave({id:uid(),title:title.trim(),description:desc,assignedTo,assignedBy:user.id,department:dept,dueDate,priority,status:"new",progress:0,estHours:parseFloat(estH)||0,actualHours:0,updates:[{id:uid(),type:"created",by:user.id,at:now(),text:"Task created and assigned."}],attachments,createdAt:now(),completedAt:null});
  };
  const deptUsers=users.filter(u=>u.active&&(dept==="all"||u.department===dept));
  return <Modal title={"✅ "+tr(lang,"newTask")} onClose={onClose} width={580}
    footer={<><Btn ch={tr(lang,"cancel")} v="ghost" onClick={onClose}/><Btn ch={tr(lang,"submit")} v="orange" onClick={save}/></>}>
    <Lbl label={tr(lang,"taskTitle")} req ch={<Inp val={title} set={st} ph={lang==="ar"?"عنوان واضح للمهمة":"Clear task title"}/>}/>
    <Lbl label={lang==="ar"?"الوصف":"Description"} ch={<Txta val={desc} set={sd} rows={2} ph={lang==="ar"?"تفاصيل وتعليمات المهمة…":"Task details and instructions…"}/>}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={tr(lang,"dept")} ch={<select value={dept} onChange={e=>{sde(e.target.value);sa("");}} style={{width:"100%",padding:"9px 13px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:13,outline:"none"}}>
        {DEPTS.map(d=><option key={d.id} value={d.id}>{lang==="ar"?d.ar:d.en}</option>)}
      </select>}/>
      <Lbl label={tr(lang,"assignTo")} req ch={<select value={assignedTo} onChange={e=>sa(e.target.value)} style={{width:"100%",padding:"9px 13px",border:"1.5px solid "+(assignedTo?C.border:C.orange),borderRadius:8,fontSize:13,outline:"none"}}>
        <option value="">{lang==="ar"?"اختر موظفاً…":"Select employee…"}</option>
        {deptUsers.map(u=><option key={u.id} value={u.id}>{u.name} — {u.position}</option>)}

// ─── LEAVES ──────────────────────────────────────────────────────────────────
function Leaves({user,leaves,setLeaves,users,lang}){
  const[tab,st]=useState("mine");const[showNew,sN]=useState(false);
  const myL=leaves.filter(l=>l.userId===user.id).sort((a,b)=>new Date(b.appliedDate)-new Date(a.appliedDate));
  const pendingAll=leaves.filter(l=>l.status==="pending"&&l.userId!==user.id&&gp(user,"leaves","approve")).sort((a,b)=>new Date(b.appliedDate)-new Date(a.appliedDate));
  const canApprove=gp(user,"leaves","approve");
  const approve=(id,action,reason)=>setLeaves(l=>l.map(x=>x.id!==id?x:{...x,status:action==="approve"?"approved":"rejected",approvedBy:user.id,approvedDate:tod(),rejectReason:action==="reject"?reason:null}));
  const tabs2=[{id:"mine",l:tr(lang,"myLeaves"),n:myL.length}];
  if(canApprove) tabs2.push({id:"pending",l:tr(lang,"pendingLeaves"),n:pendingAll.length});
  const LEAVE_COLORS={annual:{color:C.blue,bg:C.blueBg},sick:{color:C.red,bg:C.redBg},emergency:{color:C.orange,bg:C.orangeLt},unpaid:{color:C.gray,bg:C.grayBg}};
  const LTYPE_L={annual:{en:"Annual",ar:"سنوية"},sick:{en:"Sick",ar:"مرضية"},emergency:{en:"Emergency",ar:"طارئة"},unpaid:{en:"Unpaid",ar:"بدون راتب"}};
  const LS={pending:{en:"Pending",ar:"بانتظار الموافقة",color:C.yellow,bg:C.yellowBg,text:C.yellowText},approved:{en:"Approved",ar:"موافق عليها",color:C.green,bg:C.greenBg,text:C.greenText},rejected:{en:"Rejected",ar:"مرفوضة",color:C.red,bg:C.redBg,text:C.redText}};
  return(
    <div className="fade" style={{padding:24,maxWidth:900,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
        <div><div style={{fontSize:19,fontWeight:700}}>📅 {tr(lang,"leaves")}</div><div style={{fontSize:12,color:C.textLt,marginTop:2}}>{lang==="ar"?"تقديم ومتابعة طلبات الإجازة":"Submit and track leave requests"}</div></div>
        <Btn ch={lang==="ar"?"طلب إجازة جديد":"New Leave Request"} v="orange" icon="➕" onClick={()=>sN(true)}/>
      </div>
      {canApprove&&<Tabs tabs={tabs2} active={tab} onChange={st}/>}
      <div style={{display:"grid",gap:10}}>
        {(tab==="mine"||!canApprove)&&(myL.length===0?<Empty msg={tr(lang,"noData")} icon="📅"/>:myL.map(l=>{
          const s=LS[l.status];const lc=LEAVE_COLORS[l.type];
          return <Card key={l.id} ch={<div style={{padding:18}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
              <div>
                <div style={{display:"flex",gap:6,marginBottom:6}}><Bdg label={lang==="ar"?LTYPE_L[l.type]?.ar:LTYPE_L[l.type]?.en} color={lc.color} bg={lc.bg}/><span style={{display:"inline-block",background:s.bg,color:s.text,fontSize:11,fontWeight:700,padding:"2px 10px",borderRadius:20}}>{lang==="ar"?s.ar:s.en}</span></div>
                <div style={{fontSize:14,fontWeight:600,marginBottom:4}}>{l.reason}</div>
                <div style={{fontSize:12,color:C.textLt}}>{fmtD(l.startDate,lang)} — {fmtD(l.endDate,lang)} · <b>{l.days} {lang==="ar"?"أيام":"days"}</b></div>
                {l.rejectReason&&<div style={{fontSize:12,color:C.red,marginTop:4}}>{lang==="ar"?"سبب الرفض:":"Rejected:"} {l.rejectReason}</div>}
              </div>
              <div style={{textAlign:"left"}}><div style={{fontSize:11,color:C.textLt}}>{lang==="ar"?"تاريخ التقديم":"Applied"}</div><div style={{fontSize:12,fontWeight:600}}>{fmtD(l.appliedDate,lang)}</div></div>
            </div>
          </div>}/>;
        }))}
        {tab==="pending"&&canApprove&&(pendingAll.length===0?<Empty msg={lang==="ar"?"لا طلبات معلقة":"No pending leaves"} icon="✅"/>:pendingAll.map(l=>{
          const emp=users.find(u=>u.id===l.userId);const lc=LEAVE_COLORS[l.type];
          return <Card key={l.id} ch={<div style={{padding:18}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:12,flexWrap:"wrap",alignItems:"center"}}>
              <div>
                <div style={{display:"flex",gap:6,marginBottom:6}}><Bdg label={lang==="ar"?LTYPE_L[l.type]?.ar:LTYPE_L[l.type]?.en} color={lc.color} bg={lc.bg}/><Bdg label={gd(emp?.department||"",lang).name} color={gd(emp?.department||"",lang).color} bg={gd(emp?.department||"",lang).bg}/></div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:3}}>{emp?.name} — {l.reason}</div>
                <div style={{fontSize:12,color:C.textLt}}>{fmtD(l.startDate,lang)} — {fmtD(l.endDate,lang)} · <b>{l.days} {lang==="ar"?"أيام":"days"}</b></div>
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn ch={tr(lang,"approve")} v="green" sz="sm" onClick={()=>approve(l.id,"approve",null)}/>
                <Btn ch={tr(lang,"reject")} v="red" sz="sm" onClick={()=>{const r=prompt(tr(lang,"rejectReason"));if(r!==null&&r.trim())approve(l.id,"reject",r);}}/>
              </div>
            </div>
          </div>}/>;
        }))}
      </div>
      {showNew&&<NewLeave user={user} lang={lang} onClose={()=>sN(false)} onSave={l=>{setLeaves(p=>[l,...p]);sN(false);}}/>}
    </div>
  );
}

function NewLeave({user,lang,onClose,onSave}){
  const[type,st]=useState("annual");const[start,ss]=useState("");const[end,se]=useState("");const[reason,sr]=useState("");
  const days=start&&end?Math.max(0,Math.round((new Date(end)-new Date(start))/(86400000))+1):0;
  const LTYPE_L={annual:{en:"Annual Leave",ar:"إجازة سنوية"},sick:{en:"Sick Leave",ar:"إجازة مرضية"},emergency:{en:"Emergency Leave",ar:"إجازة طارئة"},unpaid:{en:"Unpaid Leave",ar:"إجازة بدون راتب"}};
  const save=()=>{
    if(!start||!end||!reason.trim()){alert(lang==="ar"?"يرجى ملء جميع الحقول":"Fill all fields");return;}
    if(days<=0){alert(lang==="ar"?"تاريخ النهاية يجب أن يكون بعد البداية":"End date must be after start");return;}
    onSave({id:uid(),userId:user.id,type,startDate:start,endDate:end,days,reason,status:"pending",appliedDate:tod(),approvedBy:null,approvedDate:null,rejectReason:null});
  };
  return <Modal title={"📅 "+(lang==="ar"?"طلب إجازة جديد":"New Leave Request")} onClose={onClose} width={480}
    footer={<><Btn ch={tr(lang,"cancel")} v="ghost" onClick={onClose}/><Btn ch={lang==="ar"?"تقديم الطلب":"Submit Request"} v="orange" onClick={save}/></>}>
    <Lbl label={lang==="ar"?"نوع الإجازة":"Leave Type"} ch={<select value={type} onChange={e=>st(e.target.value)} style={{width:"100%",padding:"9px 13px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:13,outline:"none"}}>
      {Object.entries(LTYPE_L).map(([k,v])=><option key={k} value={k}>{lang==="ar"?v.ar:v.en}</option>)}
    </select>}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={lang==="ar"?"تاريخ البداية":"Start Date"} req ch={<Inp val={start} set={ss} type="date"/>}/>
      <Lbl label={lang==="ar"?"تاريخ الانتهاء":"End Date"} req ch={<Inp val={end} set={se} type="date"/>}/>
    </div>
    {days>0&&<div style={{padding:"10px 14px",background:C.orangeLt,borderRadius:8,marginBottom:14,fontSize:13,color:C.orangeDk,fontWeight:600}}>{days} {lang==="ar"?"أيام":"days"}</div>}
    <Lbl label={lang==="ar"?"السبب / المبرر":"Reason / Justification"} req ch={<Txta val={reason} set={sr} rows={3} ph={lang==="ar"?"اشرح سبب الإجازة…":"Explain reason for leave…"}/>}/>
  </Modal>;
}

            <div key={d.name} style={{marginBottom:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>

                <span style={{fontSize:13,fontWeight:700,direction:"ltr"}}>{fmtN(d.total,0)} SAR</span>

          {deptSpend.length===0&&<Empty msg={tr(lang,"noData")}/>}
        </div>} st={{}}/>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Card ch={<div style={{padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:14}}>{lang==="ar"?"حالة المشتريات":"Procurement Status"}</div>
            {Object.entries(PRS).map(([k,v])=>{const count=procurement.filter(p=>p.status===k).length;const total=procurement.filter(p=>p.status===k).reduce((s,p)=>s+(p.grandTotal||0),0);return(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid "+C.border,fontSize:13}}>
                <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:v.color,display:"inline-block"}}/>{lang==="ar"?v.ar:v.en}</span>
                <span><b style={{color:v.color}}>{count}</b> <span style={{color:C.textLt,fontSize:11,direction:"ltr"}}>({fmtN(total,0)} SAR)</span></span>
              </div>
            );})}
          </div>} st={{}}/>
          <Card ch={<div style={{padding:20}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:14}}>{lang==="ar"?"ملخص المهام":"Task Summary"}</div>
            {Object.entries(TSS).map(([k,v])=>{const count=tasks.filter(t=>t.status===k).length;return(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid "+C.border,fontSize:13}}>
                <span style={{display:"flex",alignItems:"center",gap:6}}><span style={{width:8,height:8,borderRadius:"50%",background:v.color,display:"inline-block"}}/>{lang==="ar"?v.ar:v.en}</span>
                <b style={{color:v.color}}>{count}</b>
              </div>
            );})}
          </div>} st={{}}/>
        </div>
      </div>
    </div>
  );
}

// ─── ADMIN PANEL ──────────────────────────────────────────────────────────────
function AdminPanel2({user,users,setUsers,lang}){
  if(!gp(user,"admin","users")&&!gp(user,"admin","perms"))return <div style={{padding:40,textAlign:"center",color:C.textLt}}>{tr(lang,"noPermission")}</div>;
  const[tab,st]=useState("users");const[showNew,sN]=useState(false);const[editUser,sE]=useState(null);const[editPerms,sP]=useState(null);
  const toggleActive=id=>setUsers(l=>l.map(u=>u.id===id?{...u,active:!u.active}:u));
  const saveUser=u=>{if(u.id)setUsers(l=>l.map(x=>x.id===u.id?u:x));else setUsers(l=>[...l,{...u,id:uid(),joinDate:tod(),active:true}]);sN(false);sE(null);};
  const savePerms=(uid2,perms)=>{setUsers(l=>l.map(u=>u.id===uid2?{...u,customPerms:perms}:u));sP(null);};
  const tabs2=[{id:"users",l:lang==="ar"?"المستخدمون":"Users",n:users.filter(u=>u.active).length}];
  return(
    <div className="fade" style={{padding:24,maxWidth:1100,margin:"0 auto"}}>
      <div style={{marginBottom:18}}><div style={{fontSize:19,fontWeight:700}}>⚙️ {tr(lang,"adminPanel")}</div><div style={{fontSize:12,color:C.textLt,marginTop:2}}>{lang==="ar"?"إدارة المستخدمين والصلاحيات":"User management and permissions"}</div></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:18}}>
        <Stat label={lang==="ar"?"إجمالي المستخدمين":"Total Users"} value={users.filter(u=>u.active).length} icon="👥" color={C.navy}/>
        <Stat label={lang==="ar"?"المديرون":"Managers"} value={users.filter(u=>u.role==="manager"&&u.active).length} icon="👔" color={C.blue}/>
        <Stat label={lang==="ar"?"الموظفون":"Employees"} value={users.filter(u=>u.role==="employee"&&u.active).length} icon="👤" color={C.green}/>
        <Stat label={lang==="ar"?"موقوفون":"Inactive"} value={users.filter(u=>!u.active).length} icon="⛔" color={C.red}/>
      </div>
      <Card ch={<div style={{overflow:"hidden"}}>
        <div style={{padding:"14px 18px",borderBottom:"1px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:14,fontWeight:700}}>👥 {tr(lang,"userMgmt")}</div>
          <Btn ch={tr(lang,"addUser")} v="orange" sz="sm" icon="➕" onClick={()=>sN(true)}/>
        </div>
        <div style={{overflowX:"auto"}}>
          <table><thead><tr style={{background:C.bg}}>
            {[lang==="ar"?"الاسم":"Name",lang==="ar"?"اسم المستخدم":"Username",lang==="ar"?"القسم":"Dept",lang==="ar"?"المنصب":"Position",lang==="ar"?"الصلاحية":"Role",lang==="ar"?"الحالة":"Status",lang==="ar"?"إجراءات":"Actions"].map(h=>
              <th key={h} style={{padding:"9px 14px",fontSize:11,fontWeight:700,color:C.textLt,textAlign:"right",borderBottom:"1px solid "+C.border,whiteSpace:"nowrap"}}>{h}</th>)}
          </tr></thead>
          <tbody>{users.sort((a,b)=>a.name.localeCompare(b.name,"ar")).map((u,i)=>{
            const d=gd(u.department,lang);
            return <tr key={u.id} style={{borderBottom:"1px solid "+C.border,opacity:u.active?1:0.5,background:i%2?C.white:C.bg+"44"}}>
              <td style={{padding:"10px 14px"}}><div style={{display:"flex",alignItems:"center",gap:8}}><Avtr name={u.name} size={28} bg={d.bg} color={d.color}/><span style={{fontSize:13,fontWeight:600}}>{u.name}</span></div></td>
              <td style={{padding:"10px 14px",fontSize:12,direction:"ltr",color:C.blue}}>{u.username}</td>
              <td style={{padding:"10px 14px"}}><Bdg label={d.name} color={d.color} bg={d.bg} sz={10}/></td>
              <td style={{padding:"10px 14px",fontSize:12,color:C.textMd}}>{u.position}</td>
              <td style={{padding:"10px 14px"}}><Bdg label={tr(lang,ROLES[u.role])} color={u.role==="admin"?C.red:u.role==="procurement_admin"?C.orange:u.role==="manager"?C.blue:C.gray} bg={u.role==="admin"?C.redBg:u.role==="procurement_admin"?C.orangeLt:u.role==="manager"?C.blueBg:C.grayBg} sz={10}/></td>
              <td style={{padding:"10px 14px"}}><Bdg label={u.active?(lang==="ar"?"نشط":"Active"):(lang==="ar"?"موقوف":"Inactive")} color={u.active?C.green:C.red} bg={u.active?C.greenBg:C.redBg} sz={10}/></td>
              <td style={{padding:"10px 14px"}}>
                <div style={{display:"flex",gap:5}}>
                  {gp(user,"admin","users")&&<Btn ch={tr(lang,"edit")} v="ghost" sz="sm" onClick={()=>sE(u)}/>}
                  {gp(user,"admin","perms")&&<Btn ch={tr(lang,"permEdit")} v="ghost" sz="sm" onClick={()=>sP(u)}/>}
                  {u.id!==user.id&&gp(user,"admin","users")&&<Btn ch={u.active?(lang==="ar"?"إيقاف":"Disable"):(lang==="ar"?"تفعيل":"Enable")} v={u.active?"red":"green"} sz="sm" onClick={()=>toggleActive(u.id)}/>}
                </div>
              </td>
            </tr>;
          })}</tbody>
        </table></div>
      </div>} st={{overflow:"hidden"}}/>
      {(showNew||editUser)&&<UserModal u={editUser} lang={lang} onClose={()=>{sN(false);sE(null);}} onSave={saveUser}/>}
      {editPerms&&<PermsModal u={editPerms} lang={lang} onClose={()=>sP(null)} onSave={savePerms}/>}
    </div>
  );
}

function UserModal({u:eu,lang,onClose,onSave}){
  const[name,sn]=useState(eu?.name||"");const[username,su]=useState(eu?.username||"");
  const[password,sp]=useState(eu?.password||"");const[role,sr]=useState(eu?.role||"employee");
  const[dept,sd]=useState(eu?.department||"operations");const[pos,spo]=useState(eu?.position||"");
  const[email,se]=useState(eu?.email||"");const[phone,sph]=useState(eu?.phone||"");
  const save=()=>{
    if(!name.trim()||!username.trim()||(!eu&&!password.trim())||!pos.trim()){alert(lang==="ar"?"يرجى ملء جميع الحقول الإلزامية":"Fill all required fields");return;}
    onSave({...eu,name:name.trim(),username:username.trim(),password:password||eu?.password,role,department:dept,position:pos.trim(),email:email.trim(),phone:phone.trim(),customPerms:eu?.customPerms||null});
  };
  return <Modal title={(eu?tr(lang,"editUser"):tr(lang,"addUser"))} onClose={onClose} width={580}
    footer={<><Btn ch={tr(lang,"cancel")} v="ghost" onClick={onClose}/><Btn ch={tr(lang,"save")} v="orange" onClick={save}/></>}>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={tr(lang,"fullName")} req ch={<Inp val={name} set={sn} ph={lang==="ar"?"الاسم الكامل":"Full name"}/>}/>
      <Lbl label={tr(lang,"username")} req ch={<Inp val={username} set={su} ph="e.g. john.doe"/>}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={eu?tr(lang,"newPass"):tr(lang,"password")} req={!eu} ch={<Inp val={password} set={sp} type="password" ph={eu?(lang==="ar"?"اتركها فارغة للإبقاء":"Leave blank to keep"):"••••••••"}/>}/>
      <Lbl label={tr(lang,"position")} req ch={<Inp val={pos} set={spo} ph={lang==="ar"?"المنصب الوظيفي":"Job position"}/>}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={tr(lang,"dept")} ch={<select value={dept} onChange={e=>sd(e.target.value)} style={{width:"100%",padding:"9px 13px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:13,outline:"none"}}>
        {DEPTS.map(d=><option key={d.id} value={d.id}>{lang==="ar"?d.ar:d.en}</option>)}
      </select>}/>
      <Lbl label={tr(lang,"role")} ch={<select value={role} onChange={e=>sr(e.target.value)} style={{width:"100%",padding:"9px 13px",border:"1.5px solid "+C.border,borderRadius:8,fontSize:13,outline:"none"}}>
        {["admin","procurement_admin","manager","employee"].map(r=><option key={r} value={r}>{tr(lang,ROLES[r])}</option>)}
      </select>}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
      <Lbl label={tr(lang,"email")} ch={<Inp val={email} set={se} type="email" ph="name@lamprell.sa"/>}/>
      <Lbl label={tr(lang,"phone")} ch={<Inp val={phone} set={sph} ph="05XXXXXXXX"/>}/>
    </div>
  </Modal>;
}

function PermsModal({u,lang,onClose,onSave}){
  const rolePerms=ROLE_DEF[u.role]||{};
  const[perms,sp]=useState(()=>{
    const p={};Object.keys(ROLE_DEF.admin).forEach(mod=>{
      p[mod]={};const actions=Object.keys(ROLE_DEF.admin[mod]);
      actions.forEach(action=>{p[mod][action]=u.customPerms?.[mod]?.[action]??rolePerms[mod]?.[action]??0;});
    });return p;
  });
  const[useCustom,sC]=useState(!!u.customPerms);
  const toggle=(mod,action)=>sp(prev=>({...prev,[mod]:{...prev[mod],[action]:prev[mod][action]?0:1}}));
  const save=()=>onSave(u.id,useCustom?perms:null);
  const MOD_LABELS={procurement:{en:"Procurement",ar:"المشتريات"},tasks:{en:"Tasks",ar:"المهام"},announcements:{en:"Announcements",ar:"الإعلانات"},leaves:{en:"Leaves",ar:"الإجازات"},directory:{en:"Directory",ar:"الدليل"},reports:{en:"Reports",ar:"التقارير"},admin:{en:"Admin",ar:"الإدارة"}};
  const ACT_LABELS={view:{en:"View",ar:"مشاهدة"},create:{en:"Create",ar:"إنشاء"},approve:{en:"Approve",ar:"موافقة"},export:{en:"Export",ar:"تصدير"},admin:{en:"Admin",ar:"إدارة"},assign:{en:"Assign",ar:"إسناد"},del:{en:"Delete",ar:"حذف"},users:{en:"Users",ar:"مستخدمون"},perms:{en:"Perms",ar:"صلاحيات"}};
  return <Modal title={(lang==="ar"?"صلاحيات: ":"Permissions: ")+u.name} sub={lang==="ar"?"تخصيص ما يمكن للمستخدم فعله ومشاهدته":"Customize what this user can see and do"} onClose={onClose} width={680}
    footer={<><Btn ch={tr(lang,"cancel")} v="ghost" onClick={onClose}/><Btn ch={tr(lang,"save")} v="orange" onClick={save}/></>}>
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18,padding:"12px 16px",background:C.bg,borderRadius:9,border:"1px solid "+C.border}}>
      <Toggle val={useCustom} set={sC}/>
      <div>
        <div style={{fontSize:13,fontWeight:600}}>{lang==="ar"?"استخدام صلاحيات مخصصة":"Use Custom Permissions"}</div>
        <div style={{fontSize:11,color:C.textLt,marginTop:2}}>{lang==="ar"?"تعطيل لاستخدام الافتراضي بناءً على الدور":"Disable to use role-based defaults for "+tr(lang,ROLES[u.role])}</div>
      </div>
    </div>
    {useCustom&&<div style={{display:"grid",gap:12}}>
      {Object.keys(ROLE_DEF.admin).map(mod=>{
        const actions=Object.keys(ROLE_DEF.admin[mod]).filter(a=>ROLE_DEF.admin[mod][a]!==undefined);
        const modLabel=MOD_LABELS[mod]?.[lang==="ar"?"ar":"en"]||mod;
        return <div key={mod} style={{border:"1px solid "+C.border,borderRadius:10,overflow:"hidden"}}>
          <div style={{padding:"8px 14px",background:C.bg,borderBottom:"1px solid "+C.border,fontSize:12,fontWeight:700,color:C.navy}}>{modLabel}</div>
          <div style={{display:"flex",gap:0,flexWrap:"wrap"}}>
            {actions.map(action=>{
              const enabled=!!perms[mod]?.[action];
              const roleDefault=!!rolePerms[mod]?.[action];
              const label=ACT_LABELS[action]?.[lang==="ar"?"ar":"en"]||action;
              return <div key={action} onClick={()=>toggle(mod,action)} style={{flex:"1 0 90px",padding:"10px 14px",cursor:"pointer",borderRight:"1px solid "+C.border,borderBottom:0,display:"flex",flexDirection:"column",alignItems:"center",gap:6,background:enabled?C.greenBg:"transparent",transition:"all 0.15s",minWidth:90}}>
                <Toggle val={enabled} set={()=>toggle(mod,action)}/>
                <span style={{fontSize:11,fontWeight:600,color:enabled?C.greenText:C.textLt}}>{label}</span>
                {!roleDefault&&<span style={{fontSize:9,color:C.textLt}}>{lang==="ar"?"غير مسموح افتراضاً":"No by default"}</span>}
              </div>;
            })}
          </div>
        </div>;
      })}
    </div>}
    {!useCustom&&<div style={{padding:"16px",background:C.bg,borderRadius:9,fontSize:13,color:C.textMd,textAlign:"center"}}>
      {lang==="ar"?"سيستخدم هذا المستخدم الصلاحيات الافتراضية لدور: ":"This user will use default permissions for role: "}<b style={{color:C.navy}}>{tr(lang,ROLES[u.role])}</b>
    </div>}
  </Modal>;
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const[users,sU]=useStore("users",DU);
  const[procurement,sP]=useStore("procurement",DP);
  const[tasks,sTK]=useStore("tasks",DT);
  const[announcements,sA]=useStore("announcements",DA);
  const[leaves,sL]=useStore("leaves",DL);
  const[cu,sCU]=useState(()=>{try{const s=localStorage.getItem("lksa_session");if(s){const u=JSON.parse(s);return users.find(x=>x.id===u.id&&x.active)||null;}return null;}catch(e){return null;}});
  const[view,sV]=useState("dashboard");
  const[lang,sLG]=useState(()=>{try{return localStorage.getItem("lksa_lang")||"en";}catch(e){return"en";}});

  const setLang=useCallback(l=>{sLG(l);document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";try{localStorage.setItem("lksa_lang",l);}catch(e){}}, []);

  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";},[lang]);

  const login=useCallback(u=>{sCU(u);try{localStorage.setItem("lksa_session",JSON.stringify({id:u.id}));}catch(e){}sV("dashboard");},[]);
  const logout=useCallback(()=>{sCU(null);try{localStorage.removeItem("lksa_session");}catch(e){};},[]);
  const setView=useCallback(v=>{sV(v);window.scrollTo(0,0);},[]);

  if(!cu)return <Login users={users} onLogin={login}/>;

  const isAdmin=cu.role==="admin"||cu.role==="procurement_admin";

  const nav=[
    {id:"dashboard",title:lang==="ar"?"لوحة التحكم":"Dashboard",sub:lang==="ar"?"مرحباً بك في نظام لامبريل":"Welcome to Lamprell KSA System"},
    {id:"procurement",title:"🛒 "+(lang==="ar"?"المشتريات":"Procurement"),sub:lang==="ar"?"ضريبة القيمة المضافة 15% تُحسب تلقائياً":"VAT 15% calculated automatically"},
    {id:"tasks",title:"✅ "+(lang==="ar"?"المهام":"Tasks"),sub:lang==="ar"?"تتبع مثالي للمهام والإنجاز":"Perfect task tracking and completion"},
    {id:"announcements",title:"📢 "+(lang==="ar"?"الإعلانات":"Announcements")},
    {id:"leaves",title:"📅 "+(lang==="ar"?"طلبات الإجازة":"Leave Requests")},
    {id:"directory",title:"👥 "+(lang==="ar"?"الدليل الداخلي":"Internal Directory")},
    {id:"reports",title:"📊 "+(lang==="ar"?"التقارير والتصدير":"Reports & Export")},
    {id:"admin",title:"⚙️ "+(lang==="ar"?"الإدارة":"Administration")},
  ];
  const curNav=nav.find(n=>n.id===view)||nav[0];

  const viewMap={
    dashboard:isAdmin?<AdminDash user={cu} procurement={procurement} tasks={tasks} announcements={announcements} leaves={leaves} users={users} lang={lang} setView={setView}/>:<UserDash user={cu} procurement={procurement} tasks={tasks} announcements={announcements} leaves={leaves} lang={lang} setView={setView}/>,
    procurement:<Procurement user={cu} procurement={procurement} setProcurement={sP} users={users} lang={lang}/>,
    tasks:<Tasks user={cu} tasks={tasks} setTasks={sTK} users={users} lang={lang}/>,
    announcements:<Announcements user={cu} announcements={announcements} setAnnouncements={sA} users={users} lang={lang}/>,
    leaves:<Leaves user={cu} leaves={leaves} setLeaves={sL} users={users} lang={lang}/>,
    directory:<Directory users={users} user={cu} lang={lang}/>,
    reports:<Reports user={cu} procurement={procurement} tasks={tasks} leaves={leaves} users={users} lang={lang}/>,
    admin:<AdminPanel2 user={cu} users={users} setUsers={sU} lang={lang}/>,
  };

  return(
    <div style={{display:"flex",minHeight:"100vh",background:C.bg}}>
      <Sidebar view={view} setView={setView} user={cu} onLogout={logout} lang={lang}/>
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,overflow:"hidden"}}>
        <TopBar title={curNav.title} subtitle={curNav.sub} lang={lang} setLang={setLang}/>
        <div style={{flex:1,overflowY:"auto"}}>
          {viewMap[view]||viewMap.dashboard}
        </div>
        <div style={{padding:"8px 20px",background:C.white,borderTop:"1px solid "+C.border,fontSize:11,color:C.textLt,display:"flex",justifyContent:"space-between",flexShrink:0,direction:"ltr"}}>
          <span>Lamprell Co. — KSA Branch Internal System</span>
          <span>Developed by Hamad Al-Hzem · v2.0 · {new Date().getFullYear()}</span>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
