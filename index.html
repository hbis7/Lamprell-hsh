        function Donut({ data, size = 150 }) {
            const total = data.reduce((s, d) => s + d.v, 0);
            if (!total) return <div className="text-center text-slate-400 py-10 text-xs">No Data Loaded</div>;
            const r = 52, cx = size / 2, cy = size / 2, circ = 2 * Math.PI * r;
            let off = 0;
            const slices = data.map(d => {
                const pct = d.v / total;
                const dash = pct * circ;
                const s = { ...d, off, dash };
                off += dash;
                return s;
            });
            return (
                <div className="flex flex-col items-center">
                    <div className="relative" style={{ width: size, height: size }}>
                        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="-rotate-90 block">
                            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#E2E8F0" strokeWidth="18" />
                            {slices.map((s, i) => (
                                <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.c} strokeWidth="18"
                                    strokeDasharray={`${s.dash} ${circ - s.dash}`} strokeDashoffset={-s.off} strokeLinecap="butt" className="transition-all duration-300" />
                            ))}
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-2xl font-black text-navy">{total}</span>
                            <span className="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Total</span>
                        </div>
                    </div>
                    <div className="flex flex-wrap justify-center gap-x-4 gap-y-1.5 mt-4 max-w-xs">
                        {data.map((d, i) => (
                            <span key={i} className="flex items-center gap-1.5 text-xs">
                                <span className="w-2.5 h-2.5 rounded-full inline-block shrink-0" style={{ backgroundColor: d.c }} />
                                <span className="text-slate-500">{d.l}</span>
                                <b className="text-slate-800 font-bold">({d.v})</b>
                            </span>
                        ))}
                    </div>
                </div>
            );
        }

            const calculatedTotals = useMemo(() => {
                const sub = items.reduce((s, i) => s + (i.qty * i.unitPrice), 0);
                const tax = sub * TAX_RATE;
                return { sub, tax, grand: sub + tax };
            }, [items]);

            const handleAddItem = () => {
                setItems(prev => [...prev, { name: "", descr: "", qty: 1, unit: "pcs", unitPrice: 0, total: 0 }]);

            const handleRemoveItem = (idx) => {
                if (items.length > 1) {
                    setItems(prev => prev.filter((_, i) => i !== idx));
                }
            };

            const handleItemChange = (idx, field, val) => {
                setItems(prev => prev.map((item, i) => {
                    if (i === idx) {
                        const updated = { ...item, [field]: val };
                        if (field === "qty" || field === "unitPrice") {
                            updated.total = (updated.qty || 0) * (updated.unitPrice || 0);
                        }
                        return updated;
                    }
                    return item;
                }));
            };

        // TASK SPECIFIC DETAIL & UPDATE DIALOG
        function TaskDetailModal({ task, users, user, lang, onClose, onUpdate }) {
            const [comment, setComment] = useState("");
            const [progress, setProgress] = useState(task.progress);
            const [status, setStatus] = useState(task.status);

            const handleUpdate = (e) => {
                e.preventDefault();
                const newLogs = [...task.updates];
                if (comment.trim()) {
                    newLogs.push({
                        id: uid(),
                        type: "comment",
                        by: user.id,
                        at: now(),
                        text: comment
                    });
                }
                if (progress !== task.progress) {
                    newLogs.push({
                        id: uid(),
                        type: "progress",
                        by: user.id,
                        at: now(),
                        text: `Progress updated from ${task.progress}% to ${progress}%`
                    });
                }
                if (status !== task.status) {
                    newLogs.push({
                        id: uid(),
                        type: "status",
                        by: user.id,
                        at: now(),
                        text: `Task Status changed from ${task.status} to ${status}`
                    });
                }

                const updated = {
                    ...task,
                    status,
                    progress,
                    updates: newLogs,
                    completedAt: status === "completed" ? now() : task.completedAt
                };
                onUpdate(updated);
            };

            return (
                <Modal title={task.title} sub={gd(task.department, lang).name} onClose={onClose} width={700}>
                    <form onSubmit={handleUpdate} className="space-y-6 text-xs font-bold text-slate-700">

                                    <input type="range" min="0" max="100" step="5" value={progress} onChange={e => setProgress(+e.target.value)}

                                </div>
                            </div>

                            <div className="space-y-1">
                                <label className="block">Status Code</label>
                                <select value={status} onChange={e => setStatus(e.target.value)}

                                </select>
                            </div>

                        <div className="space-y-1">

                            <textarea rows="2" value={comment} onChange={e => setComment(e.target.value)}
                                className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" placeholder="Write operational notes, blocker updates, or QA code verification details..." />
                        </div>

                                <label className="block">{tr(lang, "estHours")}</label>
                                <input type="number" required min="1" value={estHours} onChange={e => setEstHours(+e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy" />
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">{tr(lang, "cancel")}</button>
                            <button type="submit" className="px-5 py-2 bg-navy hover:bg-navy-dark text-white rounded-lg shadow-md">{tr(lang, "submit")}</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        // WORK LEAVE APPLICATION PROCESS
        function LeaveApplyModal({ user, lang, onClose, onSave }) {
            const [type, setType] = useState("annual");
            const [start, setStart] = useState(tod());
            const [end, setEnd] = useState(tod());
            const [reason, setReason] = useState("");

            const daysComputed = useMemo(() => {
                const s = new Date(start);
                const e = new Date(end);
                const diffTime = Math.abs(e - s);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                return isNaN(diffDays) ? 0 : diffDays;
            }, [start, end]);

            const handleSubmit = (e) => {
                e.preventDefault();
                const newLeave = {
                    id: uid(),
                    userId: user.id,
                    type,
                    startDate: start,
                    endDate: end,
                    days: daysComputed,
                    reason,
                    status: "pending",
                    appliedDate: tod(),
                    approvedBy: null,
                    approvedDate: null,
                    rejectReason: null
                };
                onSave(newLeave);
            };

            return (
                <Modal title="Apply for Corporate Leave" onClose={onClose} width={500}>
                    <form onSubmit={handleSubmit} className="space-y-4 text-xs font-bold text-slate-700">
                        <div className="space-y-1">
                            <label className="block">{tr(lang, "leavetype")}</label>
                            <select value={type} onChange={e => setType(e.target.value)}
                                className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy text-slate-700">
                                <option value="annual">{tr(lang, "annual")}</option>
                                <option value="sick">{tr(lang, "sick")}</option>
                                <option value="emergency">{tr(lang, "emergency")}</option>
                                <option value="unpaid">{tr(lang, "unpaid")}</option>
                            </select>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "startDate")}</label>
                                <input type="date" required value={start} onChange={e => setStart(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "endDate")}</label>
                                <input type="date" required value={end} onChange={e => setEnd(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy" />
                            </div>
                        </div>

                        <div className="p-3 bg-slate-50 border rounded-xl text-center">
                            Computed Leave Period: <span className="text-navy font-black text-sm">{daysComputed} Days</span>
                        </div>

                        <div className="space-y-1">
                            <label className="block">Reason / Medical Certification</label>
                            <textarea required rows="3" value={reason} onChange={e => setReason(e.target.value)}
                                className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">{tr(lang, "cancel")}</button>
                            <button type="submit" className="px-5 py-2 bg-navy hover:bg-navy-dark text-white rounded-lg shadow-md">{tr(lang, "submit")}</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        // WRITE CORPORATE ANNOUNCEMENTS OR SAFETY TARIFFS
        function AnnCreateModal({ user, lang, onClose, onSave }) {
            const [titleEn, setTitleEn] = useState("");
            const [titleAr, setTitleAr] = useState("");
            const [contentEn, setContentEn] = useState("");
            const [contentAr, setContentAr] = useState("");
            const [priority, setPriority] = useState("normal");
            const [pinned, setPinned] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                const newAnn = {
                    id: uid(),
                    titleEn,
                    titleAr,
                    contentEn,
                    contentAr,
                    author: user.id,
                    departments: ["all"],
                    date: tod(),
                    priority,
                    pinned
                };
                onSave(newAnn);
            };

            return (
                <Modal title="Publish New Announcement notice" onClose={onClose} width={650}>
                    <form onSubmit={handleSubmit} className="space-y-4 text-xs font-bold text-slate-700">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="block">English Title</label>
                                <input type="text" required value={titleEn} onChange={e => setTitleEn(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">العنوان بالعربية</label>
                                <input type="text" required value={titleAr} onChange={e => setTitleAr(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" dir="rtl" />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="block">English Description Content</label>
                                <textarea required rows="4" value={contentEn} onChange={e => setContentEn(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">المحتوى بالتفصيل بالعربية</label>
                                <textarea required rows="4" value={contentAr} onChange={e => setContentAr(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" dir="rtl" />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-center pt-2">
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "priority")}</label>
                                <select value={priority} onChange={e => setPriority(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy">
                                    <option value="low">{tr(lang, "low")}</option>
                                    <option value="normal">{tr(lang, "normal")}</option>
                                    <option value="high">{tr(lang, "high")}</option>
                                    <option value="urgent">{tr(lang, "urgent")}</option>
                                </select>
                            </div>
                            <div className="flex items-center gap-2">
                                <input type="checkbox" id="pinnedAnn" checked={pinned} onChange={e => setPinned(e.target.checked)}
                                    className="w-4 h-4 text-orange focus:ring-navy accent-orange" />
                                <label htmlFor="pinnedAnn" className="cursor-pointer">Pin to Dashboard Announcement Board</label>
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">{tr(lang, "cancel")}</button>
                            <button type="submit" className="px-5 py-2 bg-navy hover:bg-navy-dark text-white rounded-lg shadow-md">{tr(lang, "submit")}</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        // SECURITY ADMIN OVERRIDES SYSTEM MODAL
        function UserAdminModal({ u, lang, onClose, onSave }) {
            const isEdit = u !== 'create';
            const [name, setName] = useState(isEdit ? u.name : "");
            const [username, setUsername] = useState(isEdit ? u.username : "");
            const [password, setPassword] = useState(isEdit ? u.password : "");
            const [role, setRole] = useState(isEdit ? u.role : "employee");
            const [dept, setDept] = useState(isEdit ? u.department : "operations");
            const [position, setPosition] = useState(isEdit ? u.position : "");
            const [email, setEmail] = useState(isEdit ? u.email : "");
            const [phone, setPhone] = useState(isEdit ? u.phone : "");

            // Overriding security permissions state
            const [customPerms, setCustomPerms] = useState(() => {
                if (isEdit && u.customPerms) return { ...u.customPerms };
                // Default structure based on chosen role default rules
                return JSON.parse(JSON.stringify(ROLE_DEF[role || "employee"]));
            });

            const handleTogglePerm = (mod, action) => {
                setCustomPerms(prev => {
                    const next = { ...prev };
                    if (!next[mod]) next[mod] = {};
                    next[mod][action] = next[mod][action] === 1 ? 0 : 1;
                    return next;
                });
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const updated = {
                    id: isEdit ? u.id : uid(),
                    name,
                    username,
                    password,
                    role,
                    department: dept,
                    position,
                    email,
                    phone,
                    joinDate: isEdit ? u.joinDate : tod(),
                    active: isEdit ? u.active : true,
                    customPerms: customPerms
                };
                onSave(updated);
            };

            return (
                <Modal title={isEdit ? tr(lang, "editUser") : tr(lang, "addUser")} onClose={onClose} width={750}>
                    <form onSubmit={handleSubmit} className="space-y-4 text-xs font-bold text-slate-700">
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "fullName")}</label>
                                <input type="text" required value={name} onChange={e => setName(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "username")}</label>
                                <input type="text" required value={username} onChange={e => setUsername(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "password")}</label>
                                <input type="text" required value={password} onChange={e => setPassword(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="space-y-1">
                                <label className="block">Security Role Class</label>
                                <select value={role} onChange={e => {
                                    setRole(e.target.value);
                                    setCustomPerms(ROLE_DEF[e.target.value]);
                                }} className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy">
                                    <option value="admin">System Admin</option>
                                    <option value="procurement_admin">Procurement Admin</option>
                                    <option value="manager">Dept Manager</option>
                                    <option value="employee">Standard Employee</option>
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="block">{tr(lang, "dept")}</label>
                                <select value={dept} onChange={e => setDept(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-bold focus:ring-1 focus:ring-navy">
                                    {DEPTS.map(d => <option key={d.id} value={d.id}>{lang === "ar" ? d.ar : d.en}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="block">Position Title</label>
                                <input type="text" required value={position} onChange={e => setPosition(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-1">
                                <label className="block">Work Email</label>
                                <input type="email" required value={email} onChange={e => setEmail(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                            <div className="space-y-1">
                                <label className="block">Saudi Phone</label>
                                <input type="text" required value={phone} onChange={e => setPhone(e.target.value)}
                                    className="w-full px-3 py-2 border rounded-xl font-medium focus:ring-1 focus:ring-navy" />
                            </div>
                        </div>

                        {/* Interactive Overriding Custom Security Permission Matrix */}
                        <div className="space-y-3 pt-3 border-t">
                            <div className="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border">
                                <span className="font-black text-navy uppercase text-[10px]">Granular Permissions Override Matrix</span>
                                <span className="text-[10px] text-orange font-bold">Overrides Standard Role Default Rules</span>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {Object.keys(customPerms).map(mod => (
                                    <div key={mod} className="p-4 bg-slate-50 rounded-xl border space-y-2">
                                        <h5 className="font-black text-navy border-b pb-1 uppercase tracking-wide text-[10px]">{mod} module</h5>
                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[11px] font-semibold text-slate-600">
                                            {Object.keys(customPerms[mod]).map(action => (
                                                <button key={action} type="button" onClick={() => handleTogglePerm(mod, action)}
                                                    className={`py-1.5 px-2.5 rounded-lg border text-left flex justify-between items-center transition-all ${customPerms[mod][action] === 1 ? "bg-navy text-white border-navy" : "bg-white text-slate-700 hover:bg-slate-100"}`}>
                                                    <span className="capitalize">{action}</span>
                                                    <span>{customPerms[mod][action] === 1 ? "✓ Granted" : "✗ Denied"}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-end gap-3 pt-4 border-t">
                            <button type="button" onClick={onClose} className="px-4 py-2 bg-slate-200 rounded-lg">{tr(lang, "cancel")}</button>
                            <button type="submit" className="px-5 py-2 bg-navy hover:bg-navy-dark text-white rounded-lg shadow-md">{tr(lang, "save")}</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
