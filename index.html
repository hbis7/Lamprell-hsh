// ─── STORAGE HOOK ──────────────────────────────────────────────────────
function useStore(key,def){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem('lmb_'+key);return s?JSON.parse(s):def;}catch(e){return def;}});
  const set=useCallback(fn=>{
    setV(prev=>{const n=typeof fn==='function'?fn(prev):fn;try{localStorage.setItem('lmb_'+key,JSON.stringify(n));}catch(e){}return n;});
  },[key]);
  return[v,set];
}

    let list=procurement;
    if(user.role==="employee") list=list.filter(p=>p.requestedBy===user.id);
    else if(user.role==="manager"&&user.department!=="finance") list=list.filter(p=>p.department===user.department||p.requestedBy===user.id);
    if(filter!=="all") list=list.filter(p=>p.status===filter);
    if(deptFilter!=="all") list=list.filter(p=>p.department===deptFilter);
    if(search) list=list.filter(p=>p.title.includes(search)||p.number.includes(search));
    return list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  },[procurement,user,filter,deptFilter,search]);

  const stats={
    total:visiblePR.length,
    pending:visiblePR.filter(p=>p.status==="pending").length,
    approved:visiblePR.filter(p=>p.status==="approved").length,
    completed:visiblePR.filter(p=>p.status==="completed").length,
  };

  const canApprove=(pr)=>{
    if(user.role==="admin") return pr.status==="pending"||pr.status==="approved";
    if(user.role==="manager"&&user.department===pr.department&&pr.status==="pending") return true;
    if(user.role==="manager"&&user.department==="finance"&&pr.status==="approved") return true;
    return false;
  };

  const handleApprove=(pr,action,note)=>{
    setProcurement(list=>list.map(p=>{
      if(p.id!==pr.id) return p;
      let newStatus=action==="approve"?(p.status==="pending"?"approved":"processing"):action==="complete"?"completed":"rejected";
      return{...p,status:newStatus,approvals:[...p.approvals,{by:user.id,role:user.position,action:action==="approve"?"approved":action==="complete"?"completed":"rejected",date:today(),note:note||""}]};
    }));
    setShowApprove(null);
    if(selected?.id===pr.id) setSelected(prev=>({...prev,status:action==="approve"?(prev.status==="pending"?"approved":"processing"):action==="complete"?"completed":"rejected"}));
  };

  if(selected) return <PRDetail pr={selected} users={users} user={user} canApprove={canApprove(selected)}
    onBack={()=>setSelected(null)} onApprove={(a,n)=>handleApprove(selected,a,n)}/>;

        <Stat label="موافق عليها" value={stats.approved} color={C.green} icon="✅"/>
        <Stat label="مكتملة" value={stats.completed} color={C.gray} icon="🏁"/>

function NewPRModal({user,onClose,onSave}){
  const[title,setTitle]=useState("");
  const[priority,setPriority]=useState("normal");
  const[justification,setJustification]=useState("");
  const[items,setItems]=useState([{id:"i1",name:"",description:"",quantity:1,unit:"قطعة",unitPrice:0,total:0}]);
  const total=items.reduce((s,i)=>s+(i.total||0),0);

  const updateItem=(idx,field,val)=>{
    setItems(prev=>prev.map((item,i)=>{
      if(i!==idx) return item;
      const updated={...item,[field]:field==="quantity"||field==="unitPrice"?parseFloat(val)||0:val};
      if(field==="quantity"||field==="unitPrice") updated.total=(updated.quantity||0)*(updated.unitPrice||0);
      return updated;
    }));
  };
  const addItem=()=>setItems(p=>[...p,{id:"i"+(p.length+1),name:"",description:"",quantity:1,unit:"قطعة",unitPrice:0,total:0}]);
  const removeItem=(idx)=>setItems(p=>p.filter((_,i)=>i!==idx));

  const save=()=>{
    if(!title.trim()||items.some(i=>!i.name.trim())){alert("يرجى ملء العنوان وجميع أسماء البنود");return;}
    const now=new Date();
    const num="PR-"+now.getFullYear()+"-"+String(Math.floor(Math.random()*9000)+1000);
    onSave({id:genId(),number:num,title:title.trim(),department:user.department,requestedBy:user.id,requestDate:today(),
      priority,status:"pending",items,totalEstimated:total,justification,notes:"",approvals:[],createdAt:now.toISOString()});
  };

  return <Modal title="🛒 طلب مشتريات جديد" onClose={onClose} width={720}>
    <Input label="عنوان الطلب" value={title} onChange={setTitle} required placeholder="مثال: شراء معدات مكتبية للقسم"/>
    <Select label="الأولوية" value={priority} onChange={setPriority} options={[{value:"normal",label:"عادية"},{value:"urgent",label:"⚡ عاجلة"},{value:"low",label:"منخفضة"}]}/>

      <div style={{fontSize:13,fontWeight:600,color:C.textMd,marginBottom:10}}>📦 البنود المطلوبة <span style={{color:C.red}}>*</span></div>
      <div style={{overflowX:"auto"}}>
        <table style={{minWidth:600}}>
          <thead><tr style={{background:C.bg}}>
            {["اسم البند","الوصف","الكمية","الوحدة","سعر الوحدة (﷼)","الإجمالي",""].map(h=>
              <th key={h} style={{padding:"7px 10px",fontSize:11,fontWeight:700,color:C.textLt,textAlign:"right",whiteSpace:"nowrap",borderBottom:"1px solid "+C.border}}>{h}</th>)}
          </tr></thead>
          <tbody>{items.map((item,idx)=><tr key={item.id} style={{borderBottom:"1px solid "+C.border}}>
            <td style={{padding:"6px 8px"}}><input value={item.name} onChange={e=>updateItem(idx,"name",e.target.value)} placeholder="اسم البند" style={{width:"100%",padding:"6px 8px",border:"1px solid "+C.border,borderRadius:6,fontSize:12}}/></td>
            <td style={{padding:"6px 8px"}}><input value={item.description} onChange={e=>updateItem(idx,"description",e.target.value)} placeholder="وصف اختياري" style={{width:"100%",padding:"6px 8px",border:"1px solid "+C.border,borderRadius:6,fontSize:12}}/></td>
            <td style={{padding:"6px 8px"}}><input type="number" value={item.quantity} onChange={e=>updateItem(idx,"quantity",e.target.value)} min="1" style={{width:60,padding:"6px 8px",border:"1px solid "+C.border,borderRadius:6,fontSize:12,textAlign:"center",direction:"ltr"}}/></td>
            <td style={{padding:"6px 8px"}}><select value={item.unit} onChange={e=>updateItem(idx,"unit",e.target.value)} style={{padding:"6px 8px",border:"1px solid "+C.border,borderRadius:6,fontSize:12}}>
              {["قطعة","متر","كيلو","لتر","علبة","رزمة","مجموعة","طن","م²"].map(u=><option key={u}>{u}</option>)}
            </select></td>
            <td style={{padding:"6px 8px"}}><input type="number" value={item.unitPrice} onChange={e=>updateItem(idx,"unitPrice",e.target.value)} min="0" style={{width:80,padding:"6px 8px",border:"1px solid "+C.border,borderRadius:6,fontSize:12,direction:"ltr"}}/></td>
            <td style={{padding:"6px 8px",fontSize:13,fontWeight:700,direction:"ltr",textAlign:"left",color:C.navy,whiteSpace:"nowrap"}}>{fmtNum(item.total)} ﷼</td>
            <td style={{padding:"6px 8px"}}>{items.length>1&&<button onClick={()=>removeItem(idx)} style={{background:C.redBg,border:"none",borderRadius:6,padding:"4px 8px",cursor:"pointer",color:C.red,fontSize:12}}>✕</button>}</td>
          </tr>)}</tbody>
          <tfoot><tr style={{background:C.goldBg}}>
            <td colSpan={5} style={{padding:"8px 10px",fontSize:13,fontWeight:700,color:C.goldText}}>الإجمالي التقديري</td>
